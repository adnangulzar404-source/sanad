name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check api ingest eval
      - name: Unit tests
        run: pytest -v --cov=sanad --cov=sanad_ingest
      - name: Adversarial evaluation gate
        run: python eval/runner.py
      - name: Ask guard gate
        run: python eval/ask_runner.py
      - name: Verify the committed corpus matches a fresh build
        # This step re-downloads Tanzil's source files (per
        # ingest/corpus.lock.toml) and rebuilds the corpus, then compares a
        # content fingerprint against the committed database. It needs
        # outbound network access to tanzil.net. If this step fails because
        # the runner cannot reach Tanzil (a network/DNS error rather than an
        # assertion failure), that is an environment problem, not a corpus
        # defect -- do not read a transient network failure here as proof the
        # corpus has drifted.
        #
        # The comparison is over CONTENT, not row counts: two databases with
        # the same number of records but different verse text would pass a
        # count-only check and still be silently wrong.
        #
        # It is over EVERY table the build writes, not just `records`. This
        # step used to hash `(records.id, records.text_ar_sha256)` and nothing
        # else, so the half of the corpus that `record_variants` and
        # `records_fts` hold was outside it: deleting a cut hadith's second
        # representation and its index rows left the digest byte-identical
        # while taking a real printed narration out of reach of every tier.
        # The rule the fingerprint has to satisfy is in
        # `corpus.db.FINGERPRINT_TABLES`, with tests, rather than in this
        # heredoc where nothing runs it.
        #
        # `corpus_source_fingerprint`, not `corpus_fingerprint`: as of Stage
        # A3 Task 4, `data/sanad-quran.db` (what `sanad-ingest build` writes
        # and what is committed) is SOURCE-only -- no `record_variants`, no
        # `records_fts`. `corpus_fingerprint` reads both and raises
        # `sqlite3.OperationalError: no such table: record_variants` against
        # this file; it needs a MATERIALIZED db (see
        # `corpus.db.corpus_fingerprint`'s own docstring). This step used
        # the wrong one, which meant it errored on every run rather than
        # comparing anything -- discovered only when Task 13's fix round
        # asked why a stale committed DB had gone unnoticed. Fixed here; see
        # `SOURCE_FINGERPRINT_TABLES` for exactly which columns this compares
        # (every source column `records` carries, `unscorable_reason`
        # included).
        run: |
          sanad-ingest build --out /tmp/rebuilt.db
          python - <<'PY'
          from sanad.corpus import db

          committed = db.corpus_source_fingerprint(db.connect("data/sanad-quran.db"))
          rebuilt = db.corpus_source_fingerprint(db.connect("/tmp/rebuilt.db"))
          assert committed == rebuilt, (
              f"committed corpus differs from a fresh build: "
              f"{committed} != {rebuilt}"
          )
          print("corpus source fingerprint:", committed)
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint:types
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      # The generated client must match the API it is generated from.
      # Stage A shipped ten defects of one shape: two things meant to agree,
      # quietly diverging, with every test still passing. This is the check
      # that makes that impossible here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: Regenerate the API client and fail on drift
        run: |
          SANAD_AUDIT_DB=/tmp/audit.db \
            uvicorn sanad.api.app:create_app --factory --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health >/dev/null && break || sleep 1
          done
          cd web && npm run generate:client
          git diff --exit-code src/api/types.ts \
            || { echo "::error::src/api/types.ts is stale. Run 'npm run generate:client' and commit."; exit 1; }
