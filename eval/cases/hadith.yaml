# Adversarial cases for the Sahih al-Bukhari layer. Same gate as every other
# file here: zero false verifications, no exceptions.
#
# A false EXACT on a hadith is worse than on an ayah. A reader who half-knows
# the Qur'an has a memorised text to catch Sanad with; almost nobody has 7,129
# hadith by heart, so whatever Sanad says about a narration is what the reader
# walks away believing. Every case below is here because the behaviour it
# describes was, at some point on this branch, wrong.
#
# Two standing rules for anything added to this file:
#
#   1. Sanad may say "this text is in Sahih al-Bukhari". It may never say, or
#      let a case imply, "this hadith is sahih". Nothing here asserts or
#      depends on an authenticity claim -- including the cases about texts that
#      are absent, where the temptation is strongest.
#   2. Every Arabic string that is meant to match the corpus was EXTRACTED
#      from the built database, byte for byte, never typed -- eleven defects
#      on this project came from Arabic altered in transit, one of them inside
#      the test written to catch them. `tests/eval/test_cases.py` re-checks
#      those bytes against the database on every run: both that the strings
#      meant to match still match, and that the one meant to differ (a
#      deliberate misquote) still differs. Add a case the same way.

- id: hadith-famous-matn-bare
  text: 'إنما الأعمال بالنيات وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:1
  rationale: >-
    THE CANARY for spec section 7. The single most quoted sentence in the collection,
    quoted the way people actually quote it: the Prophet's words alone, no chain, no
    citation. It verifies only because `text_ar` holds the matn and nothing else. Store
    the isnad in there alongside it and this span scores about 0.41 against a 0.86 floor
    (measured, see hadith-quoted-with-its-isnad) and the case fails the moment the
    invariant is undone -- which is the entire reason it exists.
- id: hadith-quoted-with-its-isnad
  text: 'حدثنا الحميدي عبد الله بن الزبير قال حدثنا سفيان قال حدثنا يحيى بن سعيد الأنصاري قال أخبرني محمد بن إبراهيم التيمي أنه سمع علقمة بن وقاص الليثي يقول سمعت عمر بن الخطاب رضي الله عنه على المنبر قال سمعت رسول الله صلى الله عليه وسلم يقول إنما الأعمال بالنيات وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه'
  expect_no_other_record: hadith:bukhari:1
  rationale: >-
    A realistic copy-paste from a website: the chain of transmission and the narration
    as one unbroken run of Arabic. MEASURED, not assumed -- NOT_FOUND at aggressive-tier
    score 0.4119, because the chain is longer than the narration and drags the
    similarity under the floor. That is a documented Stage A limitation, and the wrong
    way to fix it is to lower NEAR_THRESHOLD, which would buy this one match at the
    price of false verifications across all 13,365 records.

    The verdict is deliberately NOT pinned, so a later improvement that matches hadith 1
    correctly does not fail this case. What IS pinned is the invariant that survives any
    such improvement: whatever this does, it must not land on a DIFFERENT hadith.
    Measured, because it is not hypothetical -- drop NEAR_THRESHOLD to 0.40 and this
    text near-matches Sahih al-Bukhari 4783, a narration it has nothing to do with, and
    the reader is handed a citation to go and repeat. With no `expect_verdict`, the
    suite's zero-false-verification gate also applies to every span here, so it can
    never quietly start reporting EXACT either.
- id: hadith-with-quranic-quotation
  text: 'اللهم ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:4250
  rationale: >-
    The matn is one word of address followed by the supplication of Qur'an 2:201, which
    the source marks with @QB@ / @QE@. Those markers are stripped and the words between
    them are kept. Strip the words too and this record's stored text collapses to that
    single opening word, and the case fails -- which is precisely the check it is here
    to make.

    It is also the adversarial half of the same thing: a hadith whose wording is almost
    an ayah must still resolve to the hadith, under its own printed number, and must not
    be reported as the ayah.
- id: hadith-right-text-wrong-number
  text: 'إنما الأعمال بالنيات وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه (Bukhari 4321)'
  expect_verdict: WRONG_REFERENCE
  expect_record: hadith:bukhari:1
  rationale: >-
    Genuine wording, wrong printed number. The text is byte-identical to hadith 1, so
    the only thing wrong is the citation, and saying so is the whole point: reporting
    EXACT here would endorse a number the reader will go on to repeat.
- id: hadith-cited-as-quran
  text: 'إنما الأعمال بالنيات وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه (2:255)'
  expect_verdict: WRONG_REFERENCE
  expect_record: hadith:bukhari:1
  rationale: >-
    A hadith attributed to the Qur'an. This returned EXACT with no complaint until
    cross-kind citations were compared by kind FIRST: the record's `surah` and `ayah`
    are both NULL on a hadith, so a Qur'anic citation and a hadith record used to
    "agree" by both being nothing. Attributing the Prophet's words to the Qur'an is a
    graver error than any wrong number and must be reported, not passed over.
- id: ayah-cited-as-bukhari
  text: 'قُلْ هُوَ ٱللَّهُ أَحَدٌ (Bukhari 1)'
  expect_verdict: WRONG_REFERENCE
  expect_record: quran:112:1
  rationale: >-
    The same category error in the other direction: an ayah attributed to Sahih
    al-Bukhari. Both directions are cased because a kind check can be got right one way
    round and wrong the other, and a suite that tested only one would not notice.
- id: hadith-correct-citation-not-flagged-by-a-distant-one
  text: 'The hadith «الحرب خدعة» (Bukhari 2866) is often paired with «قُلْ هُوَ ٱللَّهُ أَحَدٌ» (112:1) in sermons.'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:2866
  forbid_verdict: WRONG_REFERENCE
  expect_verified_spans: 2
  rationale: >-
    The false-WRONG_REFERENCE case. Two correctly cited quotations in one sentence, each
    beside its own citation. A hadith span used to reach past its adjacent "(Bukhari
    2866)" and pick up the distant "(112:1)", and Sanad then told a reader their correct
    citation was a misattribution. Telling someone their correct citation is wrong is a
    false claim about scripture in its own right, and it is the failure mode the
    zero-false-verification gate does NOT catch.

    `forbid_verdict` covers BOTH spans: `expect_verdict` only ever looks at the first,
    so a version of this defect that struck the ayah instead would otherwise slip
    through.

    `expect_verified_spans: 2` is the only place in the suite that raises the
    false-verification budget above its default, and it is a stronger statement than the
    default would be, not a concession to it. This is the one case whose text really
    does contain two separately verifiable quotations; saying so leaves the gate armed
    for a THIRD. Under the old case-level gate this text had no gate at all -- expecting
    EXACT turned it off for every span, so a fabrication sitting beside a genuine ayah
    would have verified in silence.
- id: hadith-editorial-pointer-is-not-a-text
  text: '«بهذا»'
  expect_verdict: NOT_FOUND
  rationale: >-
    THE false-EXACT case. This is not a quotation of anything -- it is the edition's own
    back-reference, "with this", printed where a narration that appears in full
    elsewhere would go. It is also an everyday Arabic commonplace, and it used to return
    EXACT at score 1.0 citing Sahih al-Bukhari 1379: Sanad telling a reader that one
    everyday word was a hadith. Seventeen records in all carry an `unscorable_reason`,
    and all seventeen are excluded at every tier, from both halves of the exact-match
    lookup.

    Quoted with guillemets on purpose. Bare, it is under the extraction floor and yields
    no span at all, and a case that never reaches the matcher tests nothing.
- id: hadith-editorial-incipit-is-not-a-text
  text: '«التمسوا»'
  expect_verdict: NOT_FOUND
  rationale: >-
    The second family of unscorable record: the edition prints only the opening word,
    "seek ye", in place of the narration. A different kind of editorial apparatus from
    the back-reference above, excluded by the same mechanism -- so a fix that suppressed
    only the handful of literal pointer words would pass the case above and fail this
    one.
- id: hadith-short-matn-verifies
  text: 'لا توكي فيوكى عليك'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:1366
  rationale: >-
    Four words, and genuinely the whole matn. Short narrations are where a conservative
    extraction floor or an over-eager unscorable filter does its damage quietly: the
    text is real, the reader gets NOT_FOUND, and nothing looks broken. Paired with the
    case below, which quotes the same record the other way round.
- id: hadith-full-printed-text-is-the-same-record
  text: 'لا توكي فيوكى عليك حدثنا عثمان بن أبي شيبة عن عبدة وقال لا تحصي فيحصي الله عليك'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:1366
  rationale: >-
    The same hadith as printed, matn plus the secondary narration the edition appends
    after it. Those additions used to sit inside the scored text, so quoting the
    Prophet's words alone returned NOT_FOUND for hundreds of records. 392 now carry
    their appended material in `addenda_ar` instead, and 392 of those (all but the one
    that is unscorable anyway) are indexed under BOTH representations. Both must resolve
    to the same record: a reader who pastes the whole printed entry and a reader who
    quotes the narration alone are asking about the same hadith and must not get
    different answers.
- id: hadith-one-word-altered
  text: 'إنما الأعمال بالنية وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه'
  expect_verdict: NEAR_MATCH
  expect_record: hadith:bukhari:1
  rationale: >-
    The commonest real misquote of the most quoted hadith there is: the plural in "by
    intentions" read as a singular. One character, and the rest byte-identical to the
    corpus. MEASURED: aggressive-tier 0.9829, NEAR_MATCH with a diff. A score that high
    is exactly why the tier and the verdict are coupled -- 0.98 is not a reason to call
    something verified, and the gate here is that it never reports EXACT no matter how
    near it gets.
- id: hadith-outside-this-corpus
  text: 'الطهور شطر الإيمان'
  expect_verdict: NOT_FOUND
  expect_scope_caveat: true
  rationale: >-
    A hadith that is widely transmitted and is not in Sahih al-Bukhari. Sanad has
    nothing to say about it and must say exactly that much: this corpus is one
    collection, absence from it establishes nothing, and Sanad does not grade. NOT_FOUND
    here is a statement about a database, and the scope caveat is what stops a reader
    hearing it as a statement about the narration.

    Not copied from the corpus, because it is not in the corpus. Every word of it is
    checked against the corpus vocabulary by the generator instead -- the nearest
    available guard against a typo turning this into a case that passes for the wrong
    reason.
- id: hadith-in-circulation-not-in-corpus
  text: 'اطلبوا العلم ولو بالصين'
  expect_verdict: NOT_FOUND
  expect_scope_caveat: true
  rationale: >-
    "Seek knowledge even unto China" -- endlessly repeated, and not in this corpus. The
    point of casing it directly beside the case above is that the two must come out
    IDENTICAL. Sanad cannot tell them apart and must not pretend to: it is a text
    matcher with one collection in it, not a judge of authenticity. Any future change
    that gives this case a harsher outcome than its neighbour has invented an
    authenticity verdict Sanad has no basis for.
- id: hadith-in-personal-ruling-question
  text: 'Can I divorce my wife this way? إنما الأعمال بالنيات وإنما لكل امرئ ما نوى فمن كانت هجرته إلى دنيا يصيبها أو إلى امرأة ينكحها فهجرته إلى ما هاجر إليه'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:1
  expect_risk: PERSONAL_RULING
  expect_handoff: true
  rationale: >-
    A genuine hadith wrapped in a question only a qualified human should answer. Both
    facts are reported, and they are independent: the quotation really is verbatim
    hadith 1, AND the request must divert.

    The plan sketched this case as `expect_no_verdict: true`. That would have been false
    -- the engine does verify the quotation, and the handoff is what governs what the
    reader is shown -- so it is encoded as measured: EXACT, plus PERSONAL_RULING, plus
    the handoff. Pinning a verdict that is not produced would have made the case
    unfailable in the worst way, by describing behaviour that does not exist.
- id: hadith-arabic-citation-picks-the-cited-occurrence
  text: '«ثلاث من كن فيه وجد حلاوة الإيمان أن يكون الله ورسوله أحب إليه مما سواهما وأن يحب المرء لا يحبه إلا لله وأن يكره أن يعود في الكفر كما يكره أن يقذف في النار» صحيح البخاري ٦٥٤٢'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:6542
  rationale: >-
    The citation written the way an Arabic-speaking reader writes it: "Sahih al-Bukhari"
    in Arabic script, with an Arabic-Indic number. It has to resolve to the same record
    "(Bukhari 6542)" would, or the readers most likely to cite precisely are the ones
    Sanad serves worst.

    The matn is chosen so the case CANNOT pass without the citation being parsed and
    compared. Hadith 16 and hadith 6542 are byte-identical, so an unparsed citation
    falls back to the first tied candidate -- hadith 16 -- and `expect_record` fails. An
    earlier version of this case quoted a unique matn and survived a mutation that made
    the Arabic collection name unparseable outright, because EXACT against the right
    record is the answer with or without a citation. A case that passes whether or not
    the feature works is not a test of the feature.

    It is also the hadith form of the Ar-Rahman refrain problem: text that repeats
    verbatim under more than one number, where the only thing that can say which one the
    reader means is the citation they gave.
- id: hadith-arabic-citation-disagrees
  text: '«الحرب خدعة» صحيح البخاري ٣٤٢'
  expect_verdict: WRONG_REFERENCE
  expect_record: hadith:abudawud:2636
  rationale: >-
    Same Arabic-script citation, wrong number. Cased alongside the agreeing one because
    a parser that merely FINDS the citation and never compares its number would pass
    hadith-arabic-citation-agrees and fail here -- and a citation that is parsed but not
    checked is worse than one that is not parsed at all.

    `expect_record` moved from hadith:bukhari:2866 to hadith:abudawud:2636 in Task 12,
    when Sunan Abi Dawud's own byte-identical copy of this saying (2636) joined the tie
    and became the new tie-break winner (see
    test_a_famous_short_hadith_still_verifies_exactly). The disagreement asserted here
    -- that "342" matches none of the tied ids -- is unaffected by which one wins.
- id: hadith-arabic-citation-alone-is-not-a-quotation
  text: 'صحيح البخاري ٣٤٢'
  expect_no_quotation: true
  rationale: >-
    An Arabic-script citation is itself a run of Arabic, so this was once offered up as
    a quotation and duly answered "not in this corpus" -- a reference, reported as an
    unverifiable quotation, to a reader who had quoted nothing. Only people who cite in
    Arabic ever saw it.

    `expect_no_quotation` exists for this case: with no spans there is no verdict, so
    every verdict-shaped expectation would pass vacuously and the case would be
    incapable of failing.

# --- citations written in a numbering scheme this corpus does not ship ------
#
# The three cases below are one defect class: a citation Sanad cannot resolve
# must produce no reference at all, never a wrong one. Telling a reader that
# their correct citation is a misattribution is a false claim about scripture
# in exactly the way a false EXACT is, and it is the accusation that lands on
# the reader rather than on the text.
- id: hadith-book-relative-citation-is-not-a-misattribution
  text: 'The Prophet said «الحرب خدعة» (Sahih al-Bukhari, Book 52, Hadith 268).'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:2636
  forbid_verdict: WRONG_REFERENCE
  rationale: >-
    "Book 52, Hadith 268" is USC-MSA / sunnah.com numbering -- the form most people
    copy-paste -- and it names the same hadith as "(Bukhari 2866)", which verifies EXACT.
    The parser used to discard the book number and read 268 as an al-Bugha sequential
    number, so the reader was told their correct citation was wrong. This corpus ships
    one numbering scheme and has no USC-MSA mapping, so the honest answer is no
    reference: the quotation is verified and nothing is said about the citation.

    `expect_record` moved from hadith:bukhari:2866 to hadith:abudawud:2636 in Task 12
    for the same reason as hadith-arabic-citation-disagrees above: Abu Dawud 2636 is
    now the tie-break winner for this saying, and Bukhari 2866 moved into `also_at`.
    The book-relative citation still resolves to no reference either way, so EXACT is
    still the answer -- only the winning record id changed.
- id: hadith-colon-pair-citation-is-not-a-misattribution
  text: '«الحرب خدعة» (Bukhari 1:2:13)'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:2636
  forbid_verdict: WRONG_REFERENCE
  rationale: >-
    The same scheme written as numbers: volume, book, hadith. It used to be read as
    "Bukhari 1:2", hadith 2, and answered WRONG_REFERENCE. Cased separately from the
    spelt-out form because the two are different branches of the pattern and a fix to
    one would not touch the other.

    `expect_record` moved to hadith:abudawud:2636 for the same Task 12 tie-break reason
    given above.
- id: hadith-overlong-number-is-not-a-misattribution
  text: '«الحرب خدعة» (Bukhari 12345)'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:2636
  forbid_verdict: WRONG_REFERENCE
  rationale: >-
    `expect_record` moved to hadith:abudawud:2636 for the same Task 12 tie-break reason
    given above.

    A mistyped or foreign number, silently truncated to its first four digits by a
    digit pattern with no trailing boundary: 12345 became 1234, and a correctly quoted
    hadith beside it was called a misattribution. The number is out of range and must
    resolve to nothing -- the same trade-off the module states for every other citation
    form, where a miss costs a downgrade and noise costs a false accusation.

# --- a hadith record whose scored text was scripture ------------------------
#
# 4575's cut left a primary matn that was verbatim Qur'an 53:9-10, so Sanad
# stamped "Sahih al-Bukhari 4575" on two verses of the Qur'an and told a
# reader who cited them correctly that their reference was wrong. Both
# directions are cased, because the fix has to hold in both.
- id: quran-ayat-are-not-a-bukhari-hadith
  text: '«فَكَانَ قَابَ قَوْسَيْنِ أَوْ أَدْنَىٰ فَأَوْحَىٰٓ إِلَىٰ عَبْدِهِۦ مَآ أَوْحَىٰ»'
  expect_no_other_record: quran:53:9
  forbid_verdict: WRONG_REFERENCE
  rationale: >-
    Qur'an 53:9 and 53:10, joined, exactly as this corpus stores them. This returned
    EXACT 1.0 against Sahih al-Bukhari 4575 with an empty `also_at`, so the ayat were not
    even disclosed as alternatives: a category error about scripture, and the gravest
    misattribution this product can make.

    The verdict is deliberately not pinned. Sanad matches one record at a time and two
    joined ayat are two records, so the measured answer today is NOT_FOUND at 0.57 --
    a known Stage A limitation, not the thing this case is about. What is pinned is what
    survives any improvement to that: whatever this text does, it must not resolve to a
    hadith, and with no `expect_verdict` the zero-false-verification gate holds every
    span here to a budget of nothing.
- id: quran-ayat-cited-correctly-are-not-a-wrong-reference
  text: '«فَكَانَ قَابَ قَوْسَيْنِ أَوْ أَدْنَىٰ فَأَوْحَىٰٓ إِلَىٰ عَبْدِهِۦ مَآ أَوْحَىٰ» (53:9)'
  expect_no_other_record: quran:53:9
  forbid_verdict: WRONG_REFERENCE
  rationale: >-
    The same two verses, cited. This answered WRONG_REFERENCE against Sahih al-Bukhari
    4575 -- a reader who quotes the Qur'an and cites it correctly, told they had
    misattributed it. A false WRONG_REFERENCE is the same severity class as a false
    EXACT, and this is the case the eval gate was extended to see: it fails on the
    gate's own count, not only on the prohibition this case also declares.
- id: hadith-quranic-primary-verifies-as-printed
  text: '«فكان قاب قوسين أو أدنى فأوحى إلى عبده ما أوحى قال حدثنا بن مسعود أنه رأى جبريل له ستمائة جناح»'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:4575
  rationale: >-
    The other half of the fix. 4575 is left uncut, so its one representation is the whole
    printed hadith -- the ayah the chapter comments on, followed by Ibn Mas'ud's report
    that the Prophet saw Gabriel with six hundred wings, which is what makes the unit a
    narration. Removing a false claim must not remove a record, and this is the case that
    would notice if the remedy had been an `unscorable_reason` instead.

- id: hadith-printed-text-of-an-excluded-primary
  text: '«بينا رسول الله صلى الله عليه وسلم ساجد ح قال وحدثني أحمد بن عثمان قال حدثنا شريح بن مسلمة قال حدثنا إبراهيم بن يوسف عن أبيه عن أبي إسحاق قال حدثني عمرو بن ميمون أن عبد الله بن مسعود حدثه أن النبي صلى الله عليه وسلم كان يصلي عند البيت وأبو جهل وأصحاب له جلوس إذ قال بعضهم لبعض أيكم يجيء بسلى جزور بني فلان فيضعه على ظهر محمد إذا سجد فانبعث أشقى القوم فجاء به فنظر حتى سجد النبي صلى الله عليه وسلم وضعه على ظهره بين كتفيه وأنا أنظر لا أغير شيئا لو كان لي منعة قال فجعلوا يضحكون ويحيل بعضهم على بعض ورسول الله صلى الله عليه وسلم ساجد لا يرفع رأسه حتى جاءته فاطمة فطرحت عن ظهره فرفع رأسه ثم قال اللهم عليك بقريش ثلاث مرات فشق عليهم إذ دعا عليهم قال وكانوا يرون أن الدعوة في ذلك البلد مستجابة ثم سمى اللهم عليك بأبي جهل وعليك بعتبة بن ربيعة وشيبة بن ربيعة والوليد بن عتبة وأمية بن خلف وعقبة بن أبي معيط وعد السابع فلم نحفظه قال فوالذي نفسي بيده لقد رأيت الذين عد رسول الله صلى الله عليه وسلم صرعى في القليب قليب بدر»'
  expect_verdict: EXACT
  expect_record: hadith:bukhari:237
  rationale: >-
    Sahih al-Bukhari 237 as the edition prints it: a subordinate clause ending at the
    chain-transfer mark, and then 869 characters of narration -- the longest appended
    text in this edition, and the complete account of the camel entrails placed on the
    Prophet's back at the Ka'ba. The clause is editorial apparatus and is rightly
    unscorable; applying that judgement to the narration behind it returned NOT_FOUND
    0.393 for a reader quoting the printed hadith. Unscorability is a judgement about
    one string, and this case is the other string.

# --- Task 11: Sahih Muslim, the first non-Bukhari collection -----------------
#
# Same gate, same rules, applied to a second collection sharing this file and
# this corpus. Every text below is either extracted byte-exact from the
# MATERIALISED database (cases a, b, e) or built from explicit \u codepoints
# and never hand-pasted (the fabricated saying and the editorial pointer in
# c and d) -- the project's standing char-safety convention, restated here
# because it is precisely as load-bearing for a second collection as it was
# for the first.

- id: hadith-muslim-famous-matn-bare
  text: 'الدين النصيحة قلنا لمن قال لله ولكتابه ولرسوله ولائمة المسلمين وعامتهم'
  expect_verdict: EXACT
  expect_record: hadith:muslim:55
  rationale: >-
    "Religion is sincerity" -- one of Islam's most quoted maxims, Sahih Muslim's
    own answer to "what is religion?", quoted the bare way people actually quote
    it: no chain, no citation, no book number. The first Muslim case, and
    deliberately the same shape as hadith-famous-matn-bare: a second collection
    must clear the identical bar the first one did, not a weaker one because it
    is newer.
- id: hadith-muslim-wrong-number
  text: 'الدين النصيحة قلنا لمن قال لله ولكتابه ولرسوله ولائمة المسلمين وعامتهم (Muslim 999)'
  expect_verdict: WRONG_REFERENCE
  expect_record: hadith:muslim:55
  rationale: >-
    The same genuine wording as the case above, cited under a number that is not
    its own. MEASURED: WRONG_REFERENCE against hadith:muslim:55, score 1.0 --
    the text is verbatim, so the only thing wrong is the citation, and that is
    exactly what must be reported. Paired with hadith-right-text-wrong-number,
    which cases the identical defect class against Bukhari.
- id: hadith-muslim-fabricated-attribution
  text: 'طلب العلم فريضة على كل مسلم ومسلمة'
  expect_verdict: NOT_FOUND
  expect_scope_caveat: true
  rationale: >-
    "Seeking knowledge is an obligation upon every Muslim, male and female" --
    a saying in constant circulation, commonly attributed by memory to Sahih
    Muslim, and not this edition's wording of anything it contains (it is a
    narration usually traced to Ibn Majah). MEASURED: NOT_FOUND at 0.367,
    with and without a fabricated "(Muslim 224)" citation attached -- an
    invented citation must never manufacture a match, and the citation is left
    off the pinned case so its text can be checked directly against every
    stored representation (see test_texts_absent_from_the_corpus_really_are_absent)
    rather than trusted. This is the Muslim analogue of
    hadith-outside-this-corpus: absence from Sahih Muslim is a statement about
    a database, not a grading of the saying, hence the scope caveat.
- id: hadith-muslim-editorial-pointer-is-not-a-text
  text: '«بهذا الإسناد مثله»'
  expect_verdict: NOT_FOUND
  rationale: >-
    "bi-hadha al-isnad mithlahu" -- "with this chain, the like of it" -- Sahih
    Muslim's single most common editorial back-reference, printed in place of a
    narration that appears in full elsewhere under a different chain (108
    records in this edition print exactly this string). The Muslim analogue of
    hadith-editorial-pointer-is-not-a-text: a false EXACT here would be Sanad
    telling a reader that an everyday four-word editorial gloss is a hadith of
    the Prophet. All 721 records on `UNSCORABLE["muslim"]` are excluded by the
    same mechanism that excludes this one.
- id: hadith-muslim-quranic-primary-verifies-as-printed
  text: 'لقد كان لكم في رسول الله أسوة حسنة'
  expect_verdict: EXACT
  expect_record: hadith:muslim:1473
  rationale: >-
    The Prophet's own recitation of the opening clause of Qur'an 33:21 --
    "you have in the Messenger of Allah a good example" -- reported as a
    hadith and printed as this edition's entire matn for 1473, with the rest
    of the ayah not quoted. It must resolve to the hadith under its own
    number and must not be reported as, or silently folded into, the ayah:
    MEASURED EXACT against hadith:muslim:1473 with an empty `also_at`. The
    Muslim analogue of hadith-quranic-primary-verifies-as-printed -- the same
    hazard class Bukhari 4575 was built to catch (memory
    sanad-hadith-quranic-matn-hazard), now confirmed to recur exactly as
    predicted the moment a second collection's tafsir-adjacent chapters
    entered the corpus.

# --- R-A3-15: a common English word that is also a collection name ----------
#
# "muslim" reads as an ordinary English adjective far more often than it reads
# as a citation, and Sahih Muslim's numbering now runs from 1. The risk named
# when this rule was pinned (progress.md, Task 11 dispatch): once
# hadith:muslim:5 existed, would ordinary prose naming "the muslim 5 pillars"
# resolve as a citation to it and hand back a verdict about text nobody quoted?
- id: hadith-muslim-five-pillars-prose-is-not-a-citation
  text: 'One of the muslim 5 pillars of faith is charity.'
  expect_no_quotation: true
  rationale: >-
    MEASURED, the day Sahih Muslim's numbering entered the corpus and
    hadith:muslim:5 became a real record: `parse_citations` DOES read "muslim
    5" here as HadithReference(collection="muslim", hadith_no="5") -- the same
    grammar that lets "Yusuf 5" resolve to an ayah in prose, applied to a
    collection name that also happens to be a common English word. But
    `verify_spans` returns no match at all for this sentence: the citation
    span is excluded from ever being offered up as a quotation (the same
    mechanism `hadith-arabic-citation-alone-is-not-a-quotation` exercises for
    an Arabic-script citation with nothing beside it), and there is no other
    Arabic or guillemet-quoted text here for it to attach to. No span means no
    verdict, so `expect_no_quotation` is the only assertion that can state
    this without also asserting a verdict that does not exist. If a future
    change ever lets a bare citation surface a verdict on its own, this case
    is what would catch a reader being told something about "the muslim 5
    pillars" that nobody quoted.

