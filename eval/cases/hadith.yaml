# --- fix round 1 (R-A3-18): Abu Dawud's own compiler commentary -------------
#
# Abu Dawud al-Sijistani appends his own remarks directly after a hadith's
# matn -- "qala Abu Dawud ..." -- with no structural marker in the source, and
# the first build fused it into the single scored text_ar. That is a
# false-NEGATIVE defect the gate above never measured: it checks that nothing
# INVALID verifies, not that everything VALID does. Quoting the genuine
# Prophetic wording of hadith:abudawud:65 alone (the "qultayn" water-purity
# hadith) scored 0.457 against its own fused record and returned NOT_FOUND --
# a correct quotation of an authentic hadith, told it was not in the corpus.
# These two cases are that gap closed: the SAME record, both halves of the
# split proven independently.

- id: hadith-abudawud-compiler-commentary-fused-matn-now-verifies
  text: 'إذا كان الماء قلتين فإنه لا ينجس'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:65
  rationale: >-
    "If the water is two qullas, it does not carry impurity" -- the genuine
    Prophetic wording of hadith:abudawud:65, extracted byte-exact from the
    MATERIALISED database. Before fix round 1 this scored 0.457 / NOT_FOUND
    against its own record, because the stored text_ar was this matn fused
    with Abu Dawud's own trailing remark ("qala Abu Dawud: Hammad ibn Zayd
    stopped it [i.e. did not raise the chain further] at 'Asim") with no
    boundary between them. `_split_compiler_commentary` (openiti.py) now cuts
    the remark into `addenda_ar`, scoped to `collection == "abudawud"`, and
    this quotation is MEASURED EXACT 1.0 against hadith:abudawud:65.
- id: hadith-abudawud-compiler-commentary-fragment-is-not-a-text
  text: '«قال أبو داود حماد بن زيد وقفه عن عاصم»'
  expect_verdict: NOT_FOUND
  rationale: >-
    The other half of the same record: Abu Dawud's own remark about the
    isnad, now living in hadith:abudawud:65's `addenda_ar`, quoted alone. It
    is editorial apparatus about a chain of transmission, not a report of the
    Prophet's words, and MUST NOT verify as one -- a false EXACT here would be
    Sanad telling a reader that Abu Dawud's own aside is scripture. MEASURED
    NOT_FOUND against the fixed corpus: too small a fraction of the record's
    "full" (matn-plus-addendum) representation to score as that record, and
    not indexed as a primary text of its own.
- id: hadith-abudawud-near-miss-gap-commentary-now-verifies
  text: 'لا تركبوا الخز ولا النمار'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:4129
  rationale: >-
    "Do not ride on khazz [silk-mixed cloth] or leopard-skin [saddle-cloths]" --
    the well-known Prophetic wording of hadith:abudawud:4129, byte-exact from
    the MATERIALISED database. Fix round 1's marker required the verb
    ("qala"/"su'ila") immediately in front of "Abu Dawud"; here the source
    reads "... qala LANA Abu Dawud ..." with one word between them, so the
    marker never fired and this quotation returned NOT_FOUND (R-A3-22). Two
    more nested narrator remarks ("wa-kana Mu'awiya la yuttaham fi l-hadith
    ... qala lana Abu Sa'id ...") sat between the genuine matn and that marker
    with no chain-transmission verb for `_split_secondary` to anchor on, and
    needed a second, hand-audited cut (`NEAR_MISS_CUT_OVERRIDE`) to reach this
    exact wording. MEASURED EXACT 1.0 against hadith:abudawud:4129.
- id: hadith-abudawud-near-miss-duplicated-abu-now-verifies
  text: 'من قطع سدرة صوب الله رأسه في النار'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:5239
  rationale: >-
    "Whoever cuts a lote tree, Allah plunges his head into the Fire" -- the
    well-known Prophetic wording of hadith:abudawud:5239, byte-exact from the
    MATERIALISED database. The source itself prints a duplicated "abu" --
    "su'ila ABU Abu Dawud 'an ma'na hadha l-hadith ..." -- so fix round 1's
    marker, which required the verb immediately in front of "Abu Dawud",
    never fired and this quotation returned NOT_FOUND (R-A3-22). The
    one-token-gap fallback (`_ABUDAWUD_COMMENTARY_NEAR`) now finds it.
    MEASURED EXACT 1.0 against hadith:abudawud:5239.
- id: hadith-abudawud-lului-commentary-fused-matn-now-verifies
  text: 'أن رسول الله صلى الله عليه وسلم رئي على جبهته وعلى أرنبته أثر طين من صلاة صلاها بالناس'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:894
  rationale: >-
    hadith:abudawud:911's genuine matn -- the Prophet was seen with a trace of
    mud from a prayer he led -- fused with a remark by Abu Ali al-Lu'lu'i, the
    primary transmitter of Abu Dawud's own Sunan, not the compiler himself
    ("qala Abu Ali: this hadith Abu Dawud did not read out in the fourth
    reading [of his own book]"), and no marker existed for that voice before
