- id: hadith-abudawud-accusative-narrator-chain-now-verifies
  text: 'أن عليا رضي الله عنه كان إذا سافر سار بعد ما تغرب الشمس حتى تكاد أن تظلم ثم ينزل فيصلي المغرب ثم يدعو بعشائه فيتعشى ثم يصلي العشاء ثم يرتحل ويقول هكذا كان رسول الله صلى الله عليه وسلم يصنع'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:1234
  rationale: >-
