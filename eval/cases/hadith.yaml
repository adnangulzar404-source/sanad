    Muslim's single most common editorial back-reference, printed in place of a
    narration that appears in full elsewhere under a different chain (108
    records in this edition print exactly this string). The Muslim analogue of
    hadith-editorial-pointer-is-not-a-text: a false EXACT here would be Sanad
    telling a reader that an everyday four-word editorial gloss is a hadith of
    the Prophet. All 721 records on `UNSCORABLE["muslim"]` are excluded by the
    same mechanism that excludes this one.
- id: hadith-muslim-quranic-primary-verifies-as-printed
  text: 'لقد كان لكم في رسول الله أسوة حسنة'
  expect_verdict: EXACT
  expect_record: hadith:ibnmajah:2073
  rationale: >-
    The Prophet's own recitation of the opening clause of Qur'an 33:21 --
    "you have in the Messenger of Allah a good example" -- reported as a
    hadith and printed as this edition's entire matn for Muslim 1473, with
    the rest of the ayah not quoted. It must resolve to a hadith under its
    own number and must not be reported as, or silently folded into, the
    ayah. The Muslim analogue of hadith-quranic-primary-verifies-as-printed
    -- the same hazard class Bukhari 4575 was built to catch (memory
    sanad-hadith-quranic-matn-hazard), confirmed to recur exactly as
    predicted the moment a second collection's tafsir-adjacent chapters
    entered the corpus.

    `expect_record` moved from hadith:muslim:1473 to hadith:ibnmajah:2073 in
    Task 15: Ibn Majah 2073 carries the identical clause, attributed the same
    way (Sa'id ibn Jubayr reporting Ibn Abbas citing it while reasoning about
    oaths of prohibition), also correctly left scorable rather than caught by
    `_reject_wholly_quranic_representations` -- a genuine attributed
    quotation of the Prophet's own recitation, not a tafsir chapter printing
    the ayah it comments on. "hadith:ibnmajah:..." sorts before
    "hadith:muslim:..." under the lowest-full-id tie-break rule, so Ibn Majah
    2073 is now the winner and Muslim 1473 moved into `also_at` -- the same
    kind of tie-break-winner change already proven for
    hadith-book-relative-citation-is-not-a-misattribution above, not a new
    mechanism.

# --- R-A3-15: a common English word that is also a collection name ----------
#
# "muslim" reads as an ordinary English adjective far more often than it reads
# as a citation, and Sahih Muslim's numbering now runs from 1. The risk named
# when this rule was pinned (progress.md, Task 11 dispatch): once
# hadith:muslim:5 existed, would ordinary prose naming "the muslim 5 pillars"
# resolve as a citation to it and hand back a verdict about text nobody quoted?
- id: hadith-muslim-five-pillars-prose-is-not-a-citation
  text: 'One of the muslim 5 pillars of faith is charity.'
  expect_no_quotation: true
  rationale: >-
    MEASURED, the day Sahih Muslim's numbering entered the corpus and
    hadith:muslim:5 became a real record: `parse_citations` DOES read "muslim
    5" here as HadithReference(collection="muslim", hadith_no="5") -- the same
    grammar that lets "Yusuf 5" resolve to an ayah in prose, applied to a
    collection name that also happens to be a common English word. But
    `verify_spans` returns no match at all for this sentence: the citation
    span is excluded from ever being offered up as a quotation (the same
    mechanism `hadith-arabic-citation-alone-is-not-a-quotation` exercises for
    an Arabic-script citation with nothing beside it), and there is no other
    Arabic or guillemet-quoted text here for it to attach to. No span means no
    verdict, so `expect_no_quotation` is the only assertion that can state
    this without also asserting a verdict that does not exist. If a future
    change ever lets a bare citation surface a verdict on its own, this case
    is what would catch a reader being told something about "the muslim 5
    pillars" that nobody quoted.

