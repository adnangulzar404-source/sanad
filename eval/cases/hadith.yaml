  text: 'أصبنا صرما من جراد فكان رجل منا يضرب بسوطه وهو محرم فقيل له إن هذا لا يصلح فذكر ذلك للنبي صلى الله عليه وسلم فقال إنما هو من صيد البحر'
  expect_verdict: EXACT
  expect_record: hadith:abudawud:1854
  rationale: >-
