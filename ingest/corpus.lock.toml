# Sanad corpus lockfile.
#
# Every bundled source is pinned here with a content hash. sanad-ingest refuses
# to build if a download does not match. A corpus that cannot be reproduced is
# not shipped.
#
# content_sha256 covers the VERSE PAYLOAD ONLY -- the "surah|ayah|text" lines
# joined with "\n" (for XML sources: "surah|ayah|text" built from each aya's
# `text` attribute, same convention). It deliberately excludes the trailing/
# leading copyright block, which embeds the current year and would otherwise
# change the hash annually. The copyright block is still captured verbatim
# into sources.attribution.
#
# format is REQUIRED, not defaulted, and must be one of "xml", "txt-2", or
# "openiti-markdown". This is the provenance contract: an implicit default
# is exactly how the wrong Tanzil export got chosen for the Arabic text
# below without anyone noticing (see the comment on that entry). Each
# format also has its own required count field: "xml" and "txt-2" require
# expected_lines; "openiti-markdown" requires expected_records (see the
# Bukhari entry below and the comment on lockfile.py's
# COUNT_FIELD_BY_FORMAT).

lockfile_version = 1

# Arabic text: the XML export, not txt-2. txt-2 prepends the Bismillah to
# the text of ayah 1 for every surah except At-Tawbah -- e.g. it renders
# 112:1 as "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ"
# instead of just "قُلْ هُوَ ٱللَّهُ أَحَدٌ", which is not the verse text and
# silently corrupts similarity scoring for 112 of the corpus's 6,236
# records (disproportionately the short, heavily-quoted ones). The XML
# export instead models the Bismillah as a separate `bismillah` attribute
# on the aya element, so `text_ar` is the ayah exactly and the Bismillah is
# stored on the record as its own field.
[[source]]
id             = "tanzil-uthmani-1.1"
kind           = "quran-arabic"
format         = "xml"
title          = "Tanzil Qur'an Text (Uthmani)"
publisher      = "Tanzil Project"
edition        = "1.1"
url            = "https://tanzil.net/pub/download/index.php?quranType=uthmani&outType=xml&agree=true"
license_id     = "CC-BY-3.0"
license_url    = "https://tanzil.net/docs/text_license"
content_sha256 = "1ecb1a753a7f320eca3b0dfb24bd005e0a96e9f3441e9408060c86d6556b5bc3"
expected_lines = 6236
modifications  = "none"

# Pickthall English translation.
#
# LEGAL BASIS: the work's public-domain status, NOT a grant from Tanzil.
# Marmaduke Pickthall died in 1936, so the translation has been public domain
# since 2007 in life+70 jurisdictions and since 1 January 2026 in the US
# (published 1930; 95 years from publication). A faithful transcription of a
# public-domain text attracts no new copyright, and Tanzil's export of it
# carries a metadata-only footer asserting no rights -- unlike their Arabic
# text, which ships an explicit CC BY 3.0 block. Recording the basis as the
# work's own PD status matters because Sanad's code is MIT: a downstream
# commercial user would cross Tanzil's non-commercial term if we relied on a
# Tanzil grant instead. We do not.
#
# Note the URL: translations are served from /trans/, NOT from the
# /pub/download/ endpoint used for the Arabic text.

[[source]]
id             = "tanzil-en-pickthall"
kind           = "quran-translation"
format         = "txt-2"
# Displayed title uses the modern transliteration. The work was published in
# 1930 as "The Meaning of the Glorious Koran"; that spelling is on the original
# title page and in library catalogues.
title          = "The Meaning of the Glorious Qur'an (Pickthall)"
publisher      = "Tanzil Project (distribution)"
edition        = "en.pickthall, last updated 2010-09-04"
url            = "https://tanzil.net/trans/?transID=en.pickthall&type=txt-2"
license_id     = "public-domain"
license_url    = "https://tanzil.net/trans/"
content_sha256 = "c46125d8abd4d4fad41b2009a1a93dfc43b8a10e59354a4047617a0f8c30ba9a"
expected_lines = 6236
modifications  = "none"

# Hadith Arabic text: Sahih al-Bukhari, OpenITI's JK000110 transcription.
#
# LEGAL BASIS: the work's own public-domain status. al-Bukhari died in 870 CE.
# NOT an OpenITI licence grant -- their website states CC BY-SA, but the data
# repository OpenITI/0275AH carries no LICENSE file and the OpenITI/OpenITI
# repo's MIT licence covers their Python tooling, not corpus text (verified
# 2026-09-22). Since Sanad is MIT, relying on a grant we cannot point to would
# hand a downstream commercial user the same problem the Pickthall entry above
# avoids. OpenITI's structural markup is parsed and discarded, so what we store
# is the public-domain text and nothing else. Attribution to them is credit,
# not licence compliance.
#
# `commit` SHOULD be set for this source -- absent for the Tanzil ones because
# Tanzil publishes stable versioned exports, while OpenITI is a live git repo
# whose files are re-OCRed in place, so a branch URL is not a real pin. It IS
# set below: commit 47dfd28db9e158c7101c7df1162d4dc99bb70303 (2025-11-27, "ns
# update") was fetched via an authenticated `gh` session and verified to be
# byte-identical to the measured download -- both hash to
# 69e95684acfde24171d29dd7ba43ff2c8f9b54ade5e3ab0a73899c06671082b7 at
# 5,524,762 bytes. `url` is pinned to that exact commit rather than `master`.
#
# content_sha256 covers the COMPLETE RAW FILE, unlike the Tanzil entries where
# it covers the verse payload only. That exclusion exists solely because
# Tanzil's copyright block embeds the current year. This file has no volatile
# block, so hashing everything is simpler and stronger -- the #META# header is
# itself provenance worth pinning. Do not "harmonise" the two conventions.
[[source]]
id               = "openiti-bukhari-jk000110"
kind             = "hadith-arabic"
collection       = "bukhari"
numbering_scheme = "bugha-1987"
format           = "openiti-markdown"
title            = "الجامع الصحيح المختصر (Sahih al-Bukhari)"
publisher        = "OpenITI (transcription); Dar Ibn Kathir / al-Yamama, Beirut (edition)"
edition          = "al-Bugha, 3rd ed., 1407/1987; OpenITI JK000110, ara1.completed"
url              = "https://raw.githubusercontent.com/OpenITI/0275AH/47dfd28db9e158c7101c7df1162d4dc99bb70303/data/0256Bukhari/0256Bukhari.Sahih/0256Bukhari.Sahih.JK000110-ara1.completed"
commit           = "47dfd28db9e158c7101c7df1162d4dc99bb70303"
license_id       = "public-domain"
license_url      = "https://github.com/OpenITI/0275AH"
content_sha256   = "69e95684acfde24171d29dd7ba43ff2c8f9b54ade5e3ab0a73899c06671082b7"
expected_records = 7129
modifications    = "mARkdown structural markers parsed and discarded; no text altered"

